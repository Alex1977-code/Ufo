<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05080d">
  <meta name="description" content="AEGIS – Protokoll Erstkontakt: Taktische Alien-Abwehr mit Weltkarte, Forschung und rundenbasiertem Bodenkampf.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AEGIS – Protokoll Erstkontakt</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@600;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body data-mode="menu">
  <div id="game"></div>
  <div id="hud"></div>
  <div id="ui">
    <div id="main-menu" class="screen"></div>
  </div>
  <div id="cheat-panel" class="panel"></div>
  <div id="loading"><div class="spinner"></div><span>Lädt …</span></div>
  <div id="fps"></div>
  <div id="cheat-flag">CHEATS AKTIV</div>
  <div id="boot"><div class="spinner"></div><span>AEGIS wird initialisiert …</span>
    <noscript>Bitte JavaScript aktivieren.</noscript>
  </div>
  <script>
    // Browser-Check: WebGL2 + ES-Module erforderlich
    (function () {
      var c = document.createElement('canvas');
      if (!c.getContext('webgl2')) {
        document.getElementById('boot').innerHTML = '<p style="max-width:420px;text-align:center">Dein Browser unterstützt kein WebGL2. Bitte nutze eine aktuelle Version von Chrome, Edge, Firefox oder Safari.</p>';
      }
    })();
  </script>
  <script type="module" src="js/main.js"></script>
  <script>
    // Falls das Spiel nicht startet (z. B. sehr alter Browser oder offline ohne Cache), Hinweis statt endlosem Ladekreis
    setTimeout(function () { var b = document.getElementById('boot'); if (b) b.innerHTML = '<p style="max-width:440px;text-align:center">AEGIS konnte nicht gestartet werden. Bitte aktualisiere deinen Browser (Chrome, Edge, Firefox oder Safari ab Version 16.4) und lade die Seite neu.</p>'; }, 25000);
  </script>
</body>
</html>
